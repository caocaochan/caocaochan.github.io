<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CaoCao</title>
<link rel="icon" type="image/x-icon" href="./favicon.ico">
<link rel="icon" type="image/svg+xml" href="./favicon.svg">
<link rel="icon" type="image/png" sizes="96x96" href="./favicon-96x96.png">
<link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png">
<link rel="manifest" href="./site.webmanifest">
<script>
  const saved = localStorage.getItem('theme');
  if (saved === 'dark') document.documentElement.classList.add('dark');
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,700;1,400&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: oklch(0.98 0.008 65);
    --bg-alt: oklch(0.94 0.012 65);
    --fg: oklch(0.18 0.01 55);
    --fg-muted: oklch(0.45 0.015 55);
    --accent: oklch(0.62 0.14 45);
    --accent-hover: oklch(0.55 0.16 45);
    --border: oklch(0.88 0.012 65);
    --tag-bg: oklch(0.93 0.02 55);
    --tag-fg: oklch(0.42 0.04 55);
    --font-sans: 'DM Sans', system-ui, sans-serif;
    --font-mono: 'DM Mono', monospace;
    --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    --accordion-duration-open: 240ms;
    --accordion-duration-close: 180ms;
    --accordion-content-duration: 180ms;
    --accordion-arrow-duration: 170ms;
    --accordion-ease-open: cubic-bezier(0.2, 0.9, 0.24, 1);
    --accordion-ease-close: cubic-bezier(0.4, 0, 0.7, 1);
    --accordion-offset: 10px;
  }

  :root.dark {
    --bg: oklch(0.15 0.01 55);
    --bg-alt: oklch(0.19 0.012 55);
    --fg: oklch(0.92 0.008 65);
    --fg-muted: oklch(0.60 0.015 65);
    --accent: oklch(0.72 0.14 45);
    --accent-hover: oklch(0.78 0.12 45);
    --border: oklch(0.28 0.015 55);
    --tag-bg: oklch(0.24 0.02 55);
    --tag-fg: oklch(0.72 0.03 55);
  }

  body {
    font-family: var(--font-sans);
    background: var(--bg);
    color: var(--fg);
    transition: background var(--transition), color var(--transition);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  .container {
    max-width: 780px;
    margin: 0 auto;
    padding: 60px 32px 100px;
  }

  /* Header */
  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 64px;
  }

  .header h1 {
    font-size: 32px;
    font-weight: 700;
    letter-spacing: -0.03em;
    line-height: 1.2;
  }

  .header .subtitle {
    margin-top: 6px;
    color: var(--fg-muted);
    font-size: 15px;
    font-family: var(--font-mono);
  }

  .theme-toggle {
    background: none;
    border: 1.5px solid var(--border);
    border-radius: 50%;
    width: 40px;
    height: 40px;
    padding: 0;
    position: relative;
    overflow: hidden;
    cursor: pointer;
    display: grid;
    place-items: center;
    color: var(--fg);
    transition: all var(--transition);
    flex-shrink: 0;
    -webkit-tap-highlight-color: transparent;
  }

  .theme-toggle .icon {
    display: block;
    width: 18px;
    height: 18px;
    color: currentColor;
  }

  .theme-toggle .icon-moon {
    width: 24px;
    height: 24px;
  }

  .theme-toggle:hover {
    border-color: var(--accent);
  }

  .theme-toggle .icon-sun { display: none; }
  .theme-toggle .icon-moon { display: block; }
  :root.dark .theme-toggle .icon-sun { display: block; }
  :root.dark .theme-toggle .icon-moon { display: none; }

  /* Projects */
  .projects {
    border-top: 1px solid var(--border);
  }

  .project {
    padding: 28px 0;
    border-bottom: 1px solid var(--border);
    transition: border-color var(--transition), background var(--transition);
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }

  .project-header {
    display: flex;
    align-items: baseline;
    gap: 12px;
    flex-wrap: wrap;
  }

  .project-number {
    font-family: var(--font-mono);
    font-size: 13px;
    color: var(--fg-muted);
    min-width: 24px;
  }

  .project-name {
    font-weight: 700;
    font-size: 22px;
    text-decoration: none;
    color: var(--fg);
    transition: color var(--transition);
    letter-spacing: -0.02em;
    -webkit-tap-highlight-color: transparent;
  }

  .project:hover .project-name {
    color: var(--accent);
  }

  .project-lang {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-family: var(--font-mono);
    font-size: 13px;
    color: var(--fg-muted);
  }

  .lang-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    display: inline-block;
    flex-shrink: 0;
  }

  .expand-arrow {
    margin-left: auto;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    color: var(--fg-muted);
    transform: translateY(1px) rotate(0deg) scale(1);
    transform-origin: 50% 45%;
    transition:
      transform var(--accordion-arrow-duration) cubic-bezier(0.22, 1, 0.36, 1),
      color var(--accordion-arrow-duration) ease;
    user-select: none;
  }

  .project.expanding .expand-arrow,
  .project.expanded .expand-arrow {
    color: var(--accent);
    transform: translateY(1px) rotate(180deg) scale(0.9);
  }

  .project-desc {
    margin-top: 8px;
    margin-left: 36px;
    color: var(--fg-muted);
    font-size: 15px;
    line-height: 1.6;
    max-width: 640px;
    text-wrap: pretty;
  }

  /* Expandable details */
  .project-details {
    height: 0;
    overflow: hidden;
    margin-left: 36px;
    visibility: hidden;
    pointer-events: none;
    will-change: height;
    transition-property: height;
    transition-duration: var(--accordion-duration-open);
    transition-timing-function: var(--accordion-ease-open);
  }

  .project.expanding .project-details,
  .project.expanded .project-details,
  .project.collapsing .project-details {
    visibility: visible;
  }

  .project.expanding .project-details,
  .project.expanded .project-details {
    pointer-events: auto;
  }

  .project.collapsing .project-details {
    transition-duration: var(--accordion-duration-close);
    transition-timing-function: var(--accordion-ease-close);
  }

  .project-details-inner {
    padding-top: 16px;
    opacity: 0;
    transform: translateY(calc(var(--accordion-offset) * -1));
    transition:
      transform var(--accordion-content-duration) cubic-bezier(0.2, 0.9, 0.24, 1),
      opacity 140ms ease;
    will-change: transform, opacity;
  }

  .project.expanding .project-details-inner,
  .project.expanded .project-details-inner {
    opacity: 1;
    transform: translateY(0);
  }

  .project-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 14px;
  }

  .tag {
    background: var(--tag-bg);
    color: var(--tag-fg);
    font-size: 12px;
    font-family: var(--font-mono);
    padding: 4px 10px;
    border-radius: 4px;
    transition: all var(--transition);
  }

  .project-features {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .project-features li {
    font-size: 14px;
    color: var(--fg-muted);
    padding-left: 16px;
    position: relative;
  }

  .project-features li::before {
    content: '\00B7';
    position: absolute;
    left: 0;
    color: var(--accent);
    font-weight: 700;
  }

  .project-scripts {
    margin-top: 18px;
    padding-top: 18px;
    border-top: 1px solid var(--border);
  }

  .project-scripts-title {
    font-size: 12px;
    font-family: var(--font-mono);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--fg-muted);
    margin-bottom: 12px;
  }

  .project-scripts-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .project-script {
    display: flex;
    flex-direction: column;
    gap: 4px;
    padding: 12px 14px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--bg-alt);
    transition: border-color var(--transition), transform var(--transition);
  }

  .project-script:hover {
    border-color: var(--accent);
    transform: translateY(-1px);
  }

  .project-script-name {
    color: var(--fg);
    font-weight: 700;
    font-size: 15px;
  }

  .project-script-desc,
  .scripts-status {
    color: var(--fg-muted);
    font-size: 14px;
    line-height: 1.55;
  }

  .project-script-actions {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-top: 2px;
  }

  .project-script-action {
    color: var(--fg-muted);
    text-decoration: none;
    font-size: 12px;
    font-family: var(--font-mono);
    width: fit-content;
  }

  .project-script-action:hover {
    color: var(--accent);
  }

  @media (prefers-reduced-motion: reduce) {
    :root {
      --accordion-duration-open: 1ms;
      --accordion-duration-close: 1ms;
      --accordion-content-duration: 1ms;
      --accordion-arrow-duration: 1ms;
      --accordion-offset: 0px;
    }
  }

  .projects-status {
    padding: 28px 0;
    border-bottom: 1px solid var(--border);
    color: var(--fg-muted);
    font-size: 15px;
    line-height: 1.6;
  }

  /* Footer */
  .footer {
    margin-top: 48px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    color: var(--fg-muted);
    font-size: 13px;
    font-family: var(--font-mono);
  }

  .footer a {
    color: var(--fg-muted);
    text-decoration: none;
    border-bottom: 1px solid transparent;
    transition: all var(--transition);
    -webkit-tap-highlight-color: transparent;
  }

  .footer a:hover {
    color: var(--accent);
    border-bottom-color: var(--accent);
  }
</style>
</head>
<body>
<div class="container">
  <header class="header">
    <div>
      <h1>CaoCao</h1>
      <p class="subtitle">projects</p>
    </div>
    <button class="theme-toggle" aria-label="Toggle dark mode">
      <svg class="icon icon-moon" viewBox="0 0 24 24" aria-hidden="true">
        <defs>
          <mask id="theme-moon-mask">
            <rect width="24" height="24" fill="white"></rect>
            <circle cx="16.7" cy="10.1" r="6.8" fill="black"></circle>
          </mask>
        </defs>
        <circle cx="12.5" cy="12" r="7.8" fill="currentColor" mask="url(#theme-moon-mask)"></circle>
      </svg>
      <svg class="icon icon-sun" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="12" r="4.25" fill="currentColor"></circle>
        <g stroke="currentColor" stroke-linecap="round" stroke-width="1.8">
          <line x1="12" y1="2.5" x2="12" y2="5"></line>
          <line x1="12" y1="19" x2="12" y2="21.5"></line>
          <line x1="2.5" y1="12" x2="5" y2="12"></line>
          <line x1="19" y1="12" x2="21.5" y2="12"></line>
          <line x1="5.28" y1="5.28" x2="7.05" y2="7.05"></line>
          <line x1="16.95" y1="16.95" x2="18.72" y2="18.72"></line>
          <line x1="16.95" y1="7.05" x2="18.72" y2="5.28"></line>
          <line x1="5.28" y1="18.72" x2="7.05" y2="16.95"></line>
        </g>
      </svg>
    </button>
  </header>

  <div class="projects" id="projects-list">
    <p class="projects-status">Loading projects...</p>
  </div>

  <footer class="footer">
    <a href="https://github.com/caocaochan" target="_blank" rel="noopener noreferrer">github.com/caocaochan</a>
    <span>2026</span>
  </footer>
</div>

<script>
  var projectsList = document.getElementById('projects-list');
  var scriptsManifestCache = new Map();
  var activeProjectArticle = null;

  document.querySelector('.theme-toggle').addEventListener('click', function () {
    var isDark = document.documentElement.classList.toggle('dark');
    localStorage.setItem('theme', isDark ? 'dark' : 'light');
  });

  function createElement(tagName, className, text) {
    var el = document.createElement(tagName);
    if (className) el.className = className;
    if (text !== undefined) el.textContent = text;
    return el;
  }

  function formatProjectNumber(index) {
    return String(index + 1).padStart(2, '0');
  }

  function renderProject(project, index) {
    var article = createElement('div', 'project');
    article.addEventListener('click', function (event) {
      toggleProject(article, project, event);
    });

    var header = createElement('div', 'project-header');

    header.appendChild(createElement('span', 'project-number', formatProjectNumber(index)));

    var nameLink = createElement('a', 'project-name', project.name);
    nameLink.href = project.url;
    nameLink.target = '_blank';
    nameLink.rel = 'noopener noreferrer';
    header.appendChild(nameLink);

    var lang = createElement('span', 'project-lang');
    var langDot = createElement('span', 'lang-dot');
    langDot.style.background = project.languageColor;
    lang.appendChild(langDot);
    lang.appendChild(document.createTextNode(project.language));
    header.appendChild(lang);

    header.appendChild(createElement('span', 'expand-arrow', '\u25BE'));
    article.appendChild(header);

    article.appendChild(createElement('p', 'project-desc', project.description));

    var details = createElement('div', 'project-details');
    var detailsInner = createElement('div', 'project-details-inner');

    var tags = createElement('div', 'project-tags');
    project.tags.forEach(function (tag) {
      tags.appendChild(createElement('span', 'tag', tag));
    });
    detailsInner.appendChild(tags);

    if (Array.isArray(project.features) && project.features.length > 0) {
      var features = createElement('ul', 'project-features');
      project.features.forEach(function (feature) {
        features.appendChild(createElement('li', '', feature));
      });
      detailsInner.appendChild(features);
    }

    if (project.scriptsManifestUrl) {
      var scriptsSection = createElement('section', 'project-scripts');
      scriptsSection.hidden = true;
      scriptsSection.appendChild(createElement('p', 'project-scripts-title', 'Scripts'));
      scriptsSection.appendChild(createElement('div', 'scripts-status', 'Expand to load scripts...'));
      detailsInner.appendChild(scriptsSection);
    }

    details.appendChild(detailsInner);
    article.appendChild(details);
    return article;
  }

  function renderProjects(projects) {
    activeProjectArticle = null;
    projectsList.replaceChildren();

    if (!Array.isArray(projects) || projects.length === 0) {
      projectsList.appendChild(createElement('p', 'projects-status', 'No projects yet.'));
      return;
    }

    projects.forEach(function (project, index) {
      projectsList.appendChild(renderProject(project, index));
    });
  }

  function showProjectsError(message) {
    projectsList.replaceChildren(createElement('p', 'projects-status', message));
  }

  async function loadProjects() {
    try {
      var response = await fetch('./projects.json', { cache: 'no-store' });
      if (!response.ok) {
        throw new Error('HTTP ' + response.status);
      }

      var projects = await response.json();
      if (!Array.isArray(projects)) {
        throw new Error('Invalid projects format');
      }

      renderProjects(projects);
    } catch (error) {
      showProjectsError('Projects could not be loaded right now. Please try again later.');
      console.error('Failed to load projects:', error);
    }
  }

  async function loadProjectScripts(project, article) {
    if (!project.scriptsManifestUrl) {
      return;
    }

    var section = article.querySelector('.project-scripts');
    if (!section || section.dataset.loaded === 'true' || section.dataset.loading === 'true') {
      return;
    }

    section.hidden = false;
    section.dataset.loading = 'true';
    renderScriptsStatus(section, 'Loading scripts...');
    syncExpandedHeight(article);

    try {
      var scripts = await getProjectScripts(project.scriptsManifestUrl);
      renderProjectScripts(section, scripts);
      section.dataset.loaded = 'true';
      syncExpandedHeight(article);
    } catch (error) {
      renderScriptsStatus(section, 'Scripts could not be loaded right now.');
      syncExpandedHeight(article);
      console.error('Failed to load scripts manifest:', error);
    } finally {
      delete section.dataset.loading;
    }
  }

  async function getProjectScripts(url) {
    if (scriptsManifestCache.has(url)) {
      return scriptsManifestCache.get(url);
    }

    var response = await fetch(url, { cache: 'no-store' });
    if (!response.ok) {
      throw new Error('HTTP ' + response.status);
    }

    var manifest = await response.json();
    if (!manifest || !Array.isArray(manifest.scripts)) {
      throw new Error('Invalid scripts manifest');
    }

    scriptsManifestCache.set(url, manifest.scripts);
    return manifest.scripts;
  }

  function renderScriptsStatus(section, message) {
    section.replaceChildren(
      createElement('p', 'project-scripts-title', 'Scripts'),
      createElement('div', 'scripts-status', message)
    );
  }

  function renderProjectScripts(section, scripts) {
    section.replaceChildren();
    section.appendChild(createElement('p', 'project-scripts-title', 'Scripts'));

    if (!scripts.length) {
      section.appendChild(createElement('div', 'scripts-status', 'No scripts listed yet.'));
      return;
    }

    var list = createElement('div', 'project-scripts-list');

    scripts.forEach(function (script) {
      var item = createElement('article', 'project-script');

      item.appendChild(createElement('div', 'project-script-name', script.name || 'Unnamed script'));

      item.appendChild(createElement('p', 'project-script-desc', script.description || ''));

      var actions = createElement('div', 'project-script-actions');

      if (script.installUrl) {
        var installLink = createElement('a', 'project-script-action', 'install');
        installLink.href = script.installUrl;
        installLink.target = '_blank';
        installLink.rel = 'noopener noreferrer';
        actions.appendChild(installLink);
      }

      if (script.sourceUrl) {
        var sourceLink = createElement('a', 'project-script-action', 'source');
        sourceLink.href = script.sourceUrl;
        sourceLink.target = '_blank';
        sourceLink.rel = 'noopener noreferrer';
        actions.appendChild(sourceLink);
      }

      if (actions.childNodes.length > 0) {
        item.appendChild(actions);
      }

      list.appendChild(item);
    });

    section.appendChild(list);
  }

  function parseTimeValue(value) {
    var trimmed = value.trim();

    if (trimmed.endsWith('ms')) {
      return parseFloat(trimmed);
    }

    if (trimmed.endsWith('s')) {
      return parseFloat(trimmed) * 1000;
    }

    return 0;
  }

  function getTransitionTime(element) {
    var styles = window.getComputedStyle(element);
    var durations = styles.transitionDuration.split(',');
    var delays = styles.transitionDelay.split(',');
    var total = 0;

    for (var i = 0; i < durations.length; i += 1) {
      var duration = parseTimeValue(durations[i] || '0s');
      var delay = parseTimeValue(delays[i] || delays[delays.length - 1] || '0s');
      total = Math.max(total, duration + delay);
    }

    return total;
  }

  function getProjectDetails(article) {
    return article.querySelector('.project-details');
  }

  function cancelHeightTransition(details) {
    if (details._heightTransitionHandler) {
      details.removeEventListener('transitionend', details._heightTransitionHandler);
      details._heightTransitionHandler = null;
    }

    if (details._heightTransitionTimer) {
      window.clearTimeout(details._heightTransitionTimer);
      details._heightTransitionTimer = null;
    }
  }

  function finishHeightTransition(article, onDone) {
    var details = getProjectDetails(article);

    if (!details) {
      return;
    }

    cancelHeightTransition(details);

    var finished = false;

    function cleanup() {
      if (finished) {
        return;
      }

      finished = true;
      cancelHeightTransition(details);
      onDone();
    }

    details._heightTransitionHandler = function (event) {
      if (event.target !== details || event.propertyName !== 'height') {
        return;
      }

      cleanup();
    };

    details.addEventListener('transitionend', details._heightTransitionHandler);
    details._heightTransitionTimer = window.setTimeout(cleanup, getTransitionTime(details) + 80);
  }

  function openProject(article) {
    var details = getProjectDetails(article);

    if (!details) {
      return;
    }

    cancelHeightTransition(details);
    article.classList.remove('collapsing');
    article.classList.add('expanded');

    var startHeight = details.getBoundingClientRect().height;
    details.style.height = startHeight + 'px';
    article.classList.add('expanding');

    details.offsetHeight;
    details.style.height = details.scrollHeight + 'px';

    finishHeightTransition(article, function () {
      article.classList.remove('expanding');

      if (article.classList.contains('expanded')) {
        details.style.height = 'auto';
      }
    });
  }

  function closeProject(article) {
    var details = getProjectDetails(article);

    if (!details) {
      return;
    }

    cancelHeightTransition(details);

    var startHeight = details.getBoundingClientRect().height || details.scrollHeight;
    details.style.height = startHeight + 'px';
    article.classList.remove('expanding');
    article.classList.add('collapsing');

    details.offsetHeight;
    article.classList.remove('expanded');
    details.style.height = '0px';

    finishHeightTransition(article, function () {
      article.classList.remove('collapsing');
      details.style.height = '';
    });
  }

  function syncExpandedHeight(article) {
    if (!article || (!article.classList.contains('expanded') && !article.classList.contains('expanding'))) {
      return;
    }

    var details = getProjectDetails(article);

    if (!details) {
      return;
    }

    cancelHeightTransition(details);

    var startHeight = details.getBoundingClientRect().height;
    details.style.height = startHeight + 'px';

    details.offsetHeight;

    var targetHeight = details.scrollHeight;

    if (Math.abs(targetHeight - startHeight) < 1) {
      if (article.classList.contains('expanded') && !article.classList.contains('expanding')) {
        details.style.height = 'auto';
      }
      return;
    }

    article.classList.add('expanding');
    details.style.height = targetHeight + 'px';

    finishHeightTransition(article, function () {
      article.classList.remove('expanding');

      if (article.classList.contains('expanded')) {
        details.style.height = 'auto';
      }
    });
  }

  function toggleProject(el, project, e) {
    if (e.target.closest('a')) return;
    if (e.target.closest('.project-details')) return;

    if (activeProjectArticle === el) {
      closeProject(el);
      activeProjectArticle = null;
      return;
    }

    if (activeProjectArticle) {
      closeProject(activeProjectArticle);
    }

    activeProjectArticle = el;
    openProject(el);
    loadProjectScripts(project, el);
  }

  loadProjects();
