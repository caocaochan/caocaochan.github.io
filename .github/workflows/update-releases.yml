name: Update release snapshot

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0,12 * * *'

permissions:
  contents: write

jobs:
  update-releases:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Update release snapshot
        run: node scripts/update-releases.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Commit release snapshot
        run: |
          if git diff --quiet -- releases.json; then
            echo "No release changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add releases.json
          git commit -m "chore: update release snapshot"
          git push
